  <!-- Shoulder pads -->
  <circle cx="34" cy="98" r="10" fill="#c9d1dc" stroke="#212532" stroke-width="3"/>
  <circle cx="94" cy="98" r="10" fill="#c9d1dc" stroke="#212532" stroke-width="3"/>

